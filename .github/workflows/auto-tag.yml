name: Auto tag and release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: Forced semantic-version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: yftoolbox-version-release
  cancel-in-progress: false
  queue: max

jobs:
  calculate:
    name: Calculate version
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]')
    runs-on: windows-2025
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.version.outputs.source_sha }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Calculate next version
        id: version
        shell: pwsh
        env:
          FORCED_BUMP: ${{ inputs.bump }}
        run: |
          $forced = if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") { $env:FORCED_BUMP } else { "" }
          $result = ./build/Get-NextVersion.ps1 -ForceBump $forced | ConvertFrom-Json
          "version=$($result.Version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "source_sha=$($result.SourceSha)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $result | ConvertTo-Json | Write-Host

  release:
    name: Build and release
    needs: calculate
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.calculate.outputs.version }}
      source_sha: ${{ needs.calculate.outputs.source_sha }}
