name: Release

on:
  workflow_call:
    inputs:
      version:
        description: Three-part semantic version without the v prefix
        required: true
        type: string
      source_sha:
        description: Immutable source commit SHA
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: yftoolbox-release-${{ inputs.source_sha || github.sha }}
  cancel-in-progress: false
  queue: max

jobs:
  release:
    name: Verify, package and publish
    runs-on: windows-2025
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve and validate release inputs
        id: release
        shell: pwsh
        env:
          CALCULATED_VERSION: ${{ inputs.version }}
          CALCULATED_SHA: ${{ inputs.source_sha }}
        run: |
          $actualSha = (git rev-parse HEAD).Trim()
          if ($env:GITHUB_EVENT_NAME -eq "workflow_call") {
            $version = $env:CALCULATED_VERSION
            $sourceSha = $env:CALCULATED_SHA
          }
          else {
            if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Invalid release tag." }
            $version = $Matches[1]
            $sourceSha = $actualSha
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Version must be numeric MAJOR.MINOR.PATCH." }
          if ($sourceSha -notmatch '^[0-9a-f]{40}$') { throw "Source SHA must be immutable and complete." }
          if ($actualSha -ne $sourceSha) { throw "Checked out $actualSha, expected $sourceSha." }
          $tag = "v$version"
          $tagSha = (git rev-list -n 1 "refs/tags/$tag" 2>$null)
          if ($tagSha -and $tagSha.Trim() -ne $sourceSha) {
            throw "$tag already exists at another commit. Tags are immutable."
          }
          $buildTime = [DateTimeOffset]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "binary_version=$version.0" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "source_sha=$sourceSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "build_time=$buildTime" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$($version.StartsWith('0.').ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'NuGet.Config') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore YFToolbox.sln --configfile NuGet.Config

      - name: Build release
        run: dotnet build YFToolbox.sln --configuration Release --no-restore -p:Version="${{ steps.release.outputs.version }}" -p:AssemblyVersion="${{ steps.release.outputs.binary_version }}" -p:FileVersion="${{ steps.release.outputs.binary_version }}" -p:InformationalVersion="${{ steps.release.outputs.version }}+${{ steps.release.outputs.source_sha }}" -p:SourceRevisionId="${{ steps.release.outputs.source_sha }}" -p:BuildTimeUtc="${{ steps.release.outputs.build_time }}"

      - name: Run unit and integration tests
        run: dotnet test YFToolbox.sln --configuration Release --no-build --no-restore

      - name: Check vulnerable dependencies and capture dependency graph
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/reports -Force | Out-Null
          $vulnerabilities = dotnet list YFToolbox.sln package --vulnerable --include-transitive --format json --output-version 1 --configfile NuGet.Config
          if ($LASTEXITCODE -ne 0) { throw "Vulnerability inspection failed." }
          $vulnerabilities | Set-Content -LiteralPath artifacts/reports/vulnerabilities.json -Encoding utf8NoBOM
          ./build/Test-Vulnerabilities.ps1 -ReportPath artifacts/reports/vulnerabilities.json
          $dependencies = dotnet list YFToolbox.sln package --include-transitive --format json --output-version 1
          if ($LASTEXITCODE -ne 0) { throw "Dependency inventory failed." }
          $dependencies | Set-Content -LiteralPath artifacts/reports/dependencies.json -Encoding utf8NoBOM

      - name: Publish self-contained x64 application
        run: dotnet publish src/YFToolbox.App/YFToolbox.App.csproj --configuration Release --no-build --no-restore --runtime win-x64 --self-contained true --output artifacts/publish -p:Version="${{ steps.release.outputs.version }}" -p:AssemblyVersion="${{ steps.release.outputs.binary_version }}" -p:FileVersion="${{ steps.release.outputs.binary_version }}" -p:InformationalVersion="${{ steps.release.outputs.version }}+${{ steps.release.outputs.source_sha }}" -p:SourceRevisionId="${{ steps.release.outputs.source_sha }}" -p:BuildTimeUtc="${{ steps.release.outputs.build_time }}"

      - name: Portable startup smoke test
        shell: pwsh
        run: |
          $executable = Resolve-Path "artifacts/publish/YFToolbox.App.exe"
          $process = Start-Process -FilePath $executable -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 5
            if ($process.HasExited) { throw "Application exited early with code $($process.ExitCode)." }
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Build portable archive
        shell: pwsh
        run: ./build/Package-Portable.ps1 -PublishDirectory artifacts/publish -ArtifactDirectory artifacts/release -Version "${{ steps.release.outputs.version }}"

      - name: Generate release manifest, SBOM and checksums
        shell: pwsh
        run: ./build/New-ReleaseArtifacts.ps1 -ArtifactDirectory artifacts/release -Version "${{ steps.release.outputs.version }}" -Repository "$env:GITHUB_REPOSITORY" -SourceSha "${{ steps.release.outputs.source_sha }}" -DependencyJson artifacts/reports/dependencies.json -BuildTimeUtc "${{ steps.release.outputs.build_time }}" -DotNetVersion (dotnet --version)

      - name: Create immutable tag and complete GitHub release
        shell: pwsh
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          $sourceSha = "${{ steps.release.outputs.source_sha }}"
          $existingTagSha = (git rev-list -n 1 "refs/tags/$tag" 2>$null)
          if ($existingTagSha) {
            if ($existingTagSha.Trim() -ne $sourceSha) { throw "$tag points to another commit." }
          }
          else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate $tag $sourceSha --message "YF Toolbox $tag"
            if ($LASTEXITCODE -ne 0) { throw "Tag creation failed." }
            git push origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Tag publication failed." }
          }

          $files = @(Get-ChildItem -LiteralPath artifacts/release -File | ForEach-Object FullName)
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
            if ($LASTEXITCODE -ne 0) { throw "Release asset recovery failed." }
          }
          else {
            $arguments = @("release", "create", $tag, "--verify-tag", "--generate-notes", "--title", "YF Toolbox $tag")
            if ("${{ steps.release.outputs.prerelease }}" -eq "true") { $arguments += "--prerelease" }
            $arguments += $files
            & gh @arguments
            if ($LASTEXITCODE -ne 0) { throw "GitHub release creation failed." }
          }

          $prerelease = "${{ steps.release.outputs.prerelease }}"
          gh release edit $tag "--prerelease=$prerelease" --draft=false
          if ($LASTEXITCODE -ne 0) { throw "GitHub release finalization failed." }
